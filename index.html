<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Digital - SMP Negeri 36 Samarinda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel Export/Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; font-size: 11pt; }
            .card-box { border: 1px solid #ccc; box-shadow: none !important; }
        }
        .print-only { display: none; }
        
        .watermark-bg {
            background-image: url('https://iili.io/BxaPayB.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 380px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col relative selection:bg-blue-500 selection:text-white" x-data="jurnalApp()" x-init="initApp()">

    <!-- WATERMARK BACKGROUND WEB -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0 opacity-[0.035] select-none no-print">
        <img src="https://iili.io/BxaPayB.png" alt="Watermark SMPN 36 Samarinda" class="w-[450px] max-w-[85vw] h-auto object-contain">
    </div>

    <!-- HEADER / BRANDING BANNER -->
    <header class="bg-blue-900 text-white shadow-lg no-print sticky top-0 z-40 border-b border-blue-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white/10 p-1 rounded-full flex items-center justify-center shadow-inner border border-white/20">
                    <img src="https://iili.io/BxaPayB.png" alt="Logo SMPN 36 Samarinda" class="w-full h-full object-contain drop-shadow">
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl tracking-wide uppercase leading-tight text-yellow-300">SMP NEGERI 36 SAMARINDA</h1>
                    <p class="text-xs text-blue-200">Sistem Informasi & Monitoring Jurnal Mengajar Harian</p>
                </div>
            </div>

            <!-- User Info / Role Toggle -->
            <div class="flex items-center space-x-3 text-sm">
                <template x-if="currentUser">
                    <div class="flex items-center space-x-3">
                        <div class="text-right hidden sm:block">
                            <div class="font-semibold text-white" x-text="currentUser.name"></div>
                            <div class="text-xs text-yellow-300 font-bold uppercase" x-text="currentUser.role === 'admin' ? 'Administrator' : ('Siswa - Kelas ' + currentUser.class_name)"></div>
                        </div>
                        <button @click="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs flex items-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </div>
                </template>
                <template x-if="!currentUser">
                    <div class="bg-blue-800/80 text-blue-100 text-xs px-3 py-1.5 rounded-full border border-blue-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-shield-halved text-yellow-400"></i> Silakan Login
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none no-print">
        <template x-for="t in toasts" :key="t.id">
            <div class="pointer-events-auto p-4 rounded-xl shadow-2xl text-white text-xs font-semibold flex items-center justify-between transition-all transform duration-300"
                 :class="{
                    'bg-emerald-600': t.type === 'success',
                    'bg-red-600': t.type === 'error',
                    'bg-blue-600': t.type === 'info',
                    'bg-amber-600': t.type === 'warning'
                 }">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid text-base" :class="{
                        'fa-circle-check': t.type === 'success',
                        'fa-circle-xmark': t.type === 'error',
                        'fa-circle-info': t.type === 'info',
                        'fa-triangle-exclamation': t.type === 'warning'
                    }"></i>
                    <span x-text="t.message"></span>
                </div>
                <button @click="removeToast(t.id)" class="text-white/80 hover:text-white ml-3">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </template>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 z-10 relative">

        <!-- LOGIN SCREEN -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto my-8 sm:my-12 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden relative">
                <div class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 p-6 text-center text-white relative overflow-hidden">
                    <div class="w-16 h-16 mx-auto mb-2 bg-white/10 p-2 rounded-full border border-white/20 shadow flex items-center justify-center">
                        <img src="https://iili.io/BxaPayB.png" alt="Logo" class="w-full h-full object-contain drop-shadow">
                    </div>
                    <h2 class="text-xl font-extrabold uppercase tracking-wider text-yellow-300">SMPN 36 Samarinda</h2>
                    <p class="text-xs text-blue-200 mt-0.5">Portal Jurnal Mengajar Digital</p>
                </div>

                <div class="flex border-b border-slate-200 bg-slate-50">
                    <button @click="loginType = 'siswa'" :class="loginType === 'siswa' ? 'bg-white border-b-2 border-blue-600 text-blue-700 font-bold' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-3 text-sm text-center transition">
                        <i class="fa-solid fa-user-graduate mr-1"></i> Login Siswa
                    </button>
                    <button @click="loginType = 'admin'" :class="loginType === 'admin' ? 'bg-white border-b-2 border-blue-600 text-blue-700 font-bold' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-3 text-sm text-center transition">
                        <i class="fa-solid fa-user-gear mr-1"></i> Login Admin
                    </button>
                </div>

                <div class="p-6">
                    <template x-if="loginType === 'siswa'">
                        <form @submit.prevent="loginSiswa()">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Token Login Siswa</label>
                                    <input type="text" x-model="inputToken" placeholder="Masukkan Token Kelas (cth: TK-8A01)" required class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono uppercase">
                                </div>
                                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg transition text-sm shadow">
                                    Masuk Sebagai Siswa
                                </button>
                            </div>
                        </form>
                    </template>

                    <template x-if="loginType === 'admin'">
                        <form @submit.prevent="loginAdmin()">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Username Admin</label>
                                    <input type="text" x-model="inputAdminUser" placeholder="Username Admin" required class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password Admin</label>
                                    <input type="password" x-model="inputAdminPass" placeholder="••••••••" required class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-lg transition text-sm shadow">
                                    Masuk Sebagai Admin
                                </button>
                            </div>
                        </form>
                    </template>
                </div>
            </div>
        </template>

        <!-- DASHBOARD CONTAINER -->
        <template x-if="currentUser">
            <div>
                <!-- NAVIGATION TABS -->
                <nav class="flex flex-wrap items-center gap-2 mb-6 border-b border-slate-200 pb-3 no-print">
                    <!-- Nav Admin -->
                    <template x-if="currentUser.role === 'admin'">
                        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                            <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-blue-800 text-white font-bold' : 'bg-white text-slate-600 hover:bg-slate-100'" class="px-3.5 py-2 rounded-lg font-medium text-xs sm:text-sm transition shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-chart-pie"></i> Dashboard Admin
                            </button>
                            <button @click="activeTab = 'jurnal-all'" :class="activeTab === 'jurnal-all' ? 'bg-blue-800 text-white font-bold' : 'bg-white text-slate-600 hover:bg-slate-100'" class="px-3.5 py-2 rounded-lg font-medium text-xs sm:text-sm transition shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-book-open"></i> Rekap Jurnal
                            </button>
                        </div>
                    </template>

                    <!-- Nav Siswa -->
                    <template x-if="currentUser.role === 'siswa'">
                        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                            <button @click="activeTab = 'siswa-dash'" :class="activeTab === 'siswa-dash' ? 'bg-blue-800 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-house"></i> Beranda Siswa
                            </button>
                            <button @click="activeTab = 'form-jurnal'" :class="activeTab === 'form-jurnal' ? 'bg-blue-800 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-pen-to-square"></i> Isi Jurnal & Riwayat
                            </button>
                        </div>
                    </template>
                </nav>

                <!-- TAB ADMIN 1: DASHBOARD -->
                <template x-if="currentUser.role === 'admin' && activeTab === 'dashboard'">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-extrabold uppercase text-slate-400">Total Jurnal Hari Ini</p>
                                    <p class="text-3xl font-black text-blue-900 mt-1" x-text="getTodayJournalCount()"></p>
                                </div>
                                <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-book-bookmark"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- TAB ADMIN 2: REKAP JURNAL -->
                <template x-if="currentUser.role === 'admin' && activeTab === 'jurnal-all'">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <h3 class="text-lg font-bold text-slate-800">Rekap Laporan Jurnal Mengajar</h3>
                            <button @click="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow flex items-center gap-1.5">
                                <i class="fa-solid fa-file-excel"></i> Ekspor Excel
                            </button>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-700 uppercase font-semibold border-b">
                                        <th class="p-3">No</th>
                                        <th class="p-3">Tanggal</th>
                                        <th class="p-3">Kelas</th>
                                        <th class="p-3">Jam Ke-</th>
                                        <th class="p-3">Mata Pelajaran</th>
                                        <th class="p-3">Guru</th>
                                        <th class="p-3">Materi</th>
                                        <th class="p-3">Pelapor</th>
                                        <th class="p-3">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    <template x-for="(j, index) in journals" :key="j.id">
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3" x-text="index + 1"></td>
                                            <td class="p-3" x-text="j.date"></td>
                                            <td class="p-3 font-bold text-blue-900" x-text="j.class_name"></td>
                                            <td class="p-3 font-semibold" x-text="j.period"></td>
                                            <td class="p-3 font-semibold" x-text="j.subject"></td>
                                            <td class="p-3" x-text="j.teacher"></td>
                                            <td class="p-3" x-text="j.topic"></td>
                                            <td class="p-3" x-text="j.student_name"></td>
                                            <td class="p-3">
                                                <button @click="deleteJournal(j.id)" class="text-red-600 hover:text-red-800 p-1">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- TAB SISWA: DASHBOARD -->
                <template x-if="currentUser.role === 'siswa' && activeTab === 'siswa-dash'">
                    <div class="space-y-6">
                        <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
                            <div>
                                <span class="bg-yellow-400 text-slate-900 font-bold px-3 py-1 rounded-full text-xs uppercase">Siswa / Perwakilan Kelas</span>
                                <h2 class="text-2xl font-extrabold mt-2">Selamat Datang, <span x-text="currentUser.name"></span>!</h2>
                                <p class="text-xs text-blue-200 mt-1">Kelas <span x-text="currentUser.class_name"></span> | Database Terintegrasi Supabase Cloud</p>
                            </div>
                            <button @click="activeTab = 'form-jurnal'" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-bold px-4 py-2.5 rounded-xl shadow text-sm">
                                <i class="fa-solid fa-pen-to-square"></i> Isi Jurnal
                            </button>
                        </div>
                    </div>
                </template>

                <!-- TAB SISWA: FORM ISI JURNAL -->
                <template x-if="currentUser.role === 'siswa' && activeTab === 'form-jurnal'">
                    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                        <div class="bg-blue-900 px-6 py-4 text-white flex items-center justify-between">
                            <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-file-pen text-yellow-400"></i> Form Jurnal Mengajar</h3>
                            <span class="text-xs bg-blue-800 px-3 py-1 rounded-full">Kelas: <strong x-text="currentUser.class_name"></strong></span>
                        </div>
                        <form @submit.prevent="submitJournal()" class="p-6 space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold mb-1">Tanggal KBM</label>
                                    <input type="date" x-model="formJournal.date" @change="onDateChanged()" required class="w-full text-xs px-3 py-2 border rounded-lg bg-white font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1">Hari</label>
                                    <input type="text" x-model="formJournal.day" readonly class="w-full text-xs px-3 py-2 border rounded-lg bg-slate-100 font-bold">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold mb-1">Guru Mengajar</label>
                                    <input type="text" x-model="formJournal.teacher" placeholder="Nama Guru" required class="w-full text-xs px-3 py-2 border rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1">Mata Pelajaran</label>
                                    <input type="text" x-model="formJournal.subject" placeholder="Nama Mapel" required class="w-full text-xs px-3 py-2 border rounded-lg">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Jam Ke-</label>
                                <input type="text" x-model="formJournal.period" placeholder="Contoh: 1, 2" required class="w-full text-xs px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Status Kehadiran Guru</label>
                                <select x-model="formJournal.teacher_presence" required class="w-full text-xs px-3 py-2 border rounded-lg bg-white font-semibold">
                                    <option value="Hadir">Hadir</option>
                                    <option value="Daring">Daring</option>
                                    <option value="Tidak Hadir (Ada Tugas)">Tidak Hadir (Ada Tugas)</option>
                                    <option value="Tidak Hadir">Tidak Hadir</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Materi / Topik</label>
                                <textarea x-model="formJournal.topic" rows="3" required class="w-full text-xs px-3 py-2 border rounded-lg" placeholder="Tuliskan bab atau materi..."></textarea>
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg text-sm transition">
                                <i class="fa-solid fa-paper-plane"></i> Simpan & Kirim ke Supabase Cloud
                            </button>
                        </form>
                    </div>
                </template>
            </div>
        </template>
    </main>

    <!-- SCRIPT APPLICATION -->
    <script>
        // Supabase Initialization Client
        const SUPABASE_URL = 'https://lclrbdwwgxlyiroleegn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjbHJiZHd3Z3hseWlyb2xlZWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MjkxMjEsImV4cCI6MjEwNzAwNTEyMX0.tJ2EPpfoIjuxXAMw4dC8-beJfhakZUP3-ACqxkN9DPA';
        
        let supabaseClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error('Gagal menginisialisasi Supabase:', e);
        }

        function jurnalApp() {
            return {
                currentUser: null,
                loginType: 'siswa',
                inputToken: '',
                inputAdminUser: '',
                inputAdminPass: '',
                activeTab: 'dashboard',
                toasts: [],

                journals: [],
                teachers: [],
                students: [],
                classList: ['7A', '7B', '8A', '8B', '9A', '9B'],
                subjectList: ['Matematika', 'Bahasa Indonesia', 'IPA', 'IPS', 'Bahasa Inggris', 'PAI', 'PJOK'],
                adminCredentials: { username: 'admin', password: 'admin123' },

                formJournal: {
                    date: '',
                    day: '',
                    teacher: '',
                    subject: '',
                    period: '',
                    sakit: 0,
                    izin: 0,
                    alpa: 0,
                    absent_count: 0,
                    teacher_presence: 'Hadir',
                    topic: ''
                },

                async initApp() {
                    await this.loadStoredData();
                    this.setFormToToday();

                    const savedUser = localStorage.getItem('smpn36_session_user');
                    if (savedUser) {
                        try {
                            this.currentUser = JSON.parse(savedUser);
                            this.activeTab = this.currentUser.role === 'admin' ? 'dashboard' : 'siswa-dash';
                        } catch (e) {}
                    }
                },

                async loadStoredData() {
                    if (!supabaseClient) return;

                    try {
                        const { data: jData } = await supabaseClient.from('journals').select('*').order('id', { ascending: false });
                        if (jData) this.journals = jData;
                    } catch (err) {
                        console.error("Error loading Supabase data:", err);
                    }
                },

                addToast(message, type = 'success') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type });
                    setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 4000);
                },

                removeToast(id) {
                    this.toasts = this.toasts.filter(t => t.id !== id);
                },

                loginAdmin() {
                    if (this.inputAdminUser === this.adminCredentials.username && this.inputAdminPass === this.adminCredentials.password) {
                        this.currentUser = { name: 'Administrator SMPN 36', role: 'admin' };
                        localStorage.setItem('smpn36_session_user', JSON.stringify(this.currentUser));
                        this.activeTab = 'dashboard';
                        this.addToast('Login Administrator Berhasil', 'success');
                    } else {
                        this.addToast('Username atau password Admin salah!', 'error');
                    }
                },

                loginSiswa() {
                    const token = this.inputToken.trim().toUpperCase();
                    let student = { name: 'Siswa Perwakilan ' + token, class_name: token.replace('TK-', ''), token: token };

                    this.currentUser = { name: student.name, role: 'siswa', class_name: student.class_name, token: student.token };
                    localStorage.setItem('smpn36_session_user', JSON.stringify(this.currentUser));
                    this.activeTab = 'siswa-dash';
                    this.addToast(`Selamat Datang ${student.name}`, 'success');
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('smpn36_session_user');
                    this.addToast('Anda telah logout', 'info');
                },

                setFormToToday() {
                    const today = new Date();
                    this.formJournal.date = today.toISOString().slice(0, 10);
                    this.onDateChanged();
                },

                onDateChanged() {
                    if (!this.formJournal.date) return;
                    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                    const dateObj = new Date(this.formJournal.date + 'T00:00:00');
                    this.formJournal.day = days[dateObj.getDay()];
                },

                async submitJournal() {
                    const newEntry = {
                        id: Date.now(),
                        date: this.formJournal.date,
                        day: this.formJournal.day,
                        class_name: this.currentUser.class_name,
                        period: this.formJournal.period,
                        subject: this.formJournal.subject,
                        teacher: this.formJournal.teacher,
                        teacher_presence: this.formJournal.teacher_presence,
                        topic: this.formJournal.topic,
                        sakit: Number(this.formJournal.sakit) || 0,
                        izin: Number(this.formJournal.izin) || 0,
                        alpa: Number(this.formJournal.alpa) || 0,
                        absent_count: (Number(this.formJournal.sakit) || 0) + (Number(this.formJournal.izin) || 0) + (Number(this.formJournal.alpa) || 0),
                        student_name: this.currentUser.name,
                        timestamp: new Date().toISOString()
                    };

                    if (supabaseClient) {
                        const { error } = await supabaseClient.from('journals').insert([newEntry]);
                        if (error) {
                            console.error(error);
                            this.addToast('Gagal menyimpan data ke Supabase!', 'error');
                            return;
                        }
                    }

                    this.journals.unshift(newEntry);
                    this.addToast('Jurnal KBM berhasil tersimpan ke Supabase!', 'success');
                    this.formJournal.topic = '';
                    this.formJournal.period = '';
                },

                async deleteJournal(id) {
                    if (supabaseClient) {
                        await supabaseClient.from('journals').delete().eq('id', id);
                    }
                    this.journals = this.journals.filter(j => j.id !== id);
                    this.addToast('Data jurnal berhasil dihapus', 'success');
                },

                getTodayJournalCount() {
                    const today = new Date().toISOString().slice(0, 10);
                    return this.journals.filter(j => j.date === today).length;
                },

                exportExcel() {
                    if (typeof XLSX === 'undefined') return;
                    const ws = XLSX.utils.json_to_sheet(this.journals);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Rekap Jurnal");
                    XLSX.writeFile(wb, `Rekap_Jurnal_SMPN36_${new Date().toISOString().slice(0,10)}.xlsx`);
                    this.addToast('File Excel berhasil diunduh', 'success');
                }
            };
        }
    </script>
</body>
</html>
